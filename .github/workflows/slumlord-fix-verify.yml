name: Slum Lord Fix Verify

on:
  push:
    branches:
      - fix/slumlord-auction-and-readable-rails

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Slum Lord bot automation tests
        run: node --test src/games/slumlord/botAutomation.test.js src/games/slumlord/isolation.test.js
      - name: Full test discovery
        run: npm test
      - name: Production build
        run: npm run build
