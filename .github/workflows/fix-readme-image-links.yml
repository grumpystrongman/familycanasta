name: Fix README image links

on:
  push:
    branches: [fix/readme-screenshot-assets]

permissions:
  contents: write

jobs:
  patch-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-screenshot-assets
          fetch-depth: 0

      - name: Point README at committed image assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          replacements = {
              'docs/images/family-card-room-hub.png': 'docs/images/family-card-room-hub.svg',
              'docs/images/canasta-game-table.png': 'docs/images/canasta-game-table.svg',
              'docs/images/hearts-game-table.png': 'docs/images/hearts-game-table.svg',
              'docs/images/spades-game-table.png': 'docs/images/spades-game-table.svg',
              'docs/images/rummy-game-table.png': 'docs/images/rummy-game-table.svg',
              'The images below are captured from the running application with Playwright. The capture script creates real Firebase rooms and fills open seats with robots so the documentation reflects the actual product rather than a design mockup.': 'The interface previews below show the central hub and the four implemented game tables. They are stored with the repository so the README remains reliable across branches, deployments, and artifact-retention windows.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected README text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          rm .github/workflows/fix-readme-image-links.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/fix-readme-image-links.yml
          git commit -m "Fix README screenshot links"
          git push origin HEAD:fix/readme-screenshot-assets
