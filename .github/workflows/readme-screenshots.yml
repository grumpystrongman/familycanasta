name: Capture README screenshots

on:
  pull_request:
    paths:
      - README.md
      - scripts/capture-readme-screenshots.mjs
      - .github/workflows/readme-screenshots.yml
      - src/**
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application and browser tooling
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Load public Firebase web configuration
        run: |
          curl --fail --silent --show-error \
            https://family-canasta-ce7d2.web.app/__/firebase/init.json \
            --output firebase-init.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("firebase-init.json", "utf8"));
          const lines = [
            ["VITE_FIREBASE_API_KEY", config.apiKey],
            ["VITE_FIREBASE_AUTH_DOMAIN", config.authDomain],
            ["VITE_FIREBASE_DATABASE_URL", config.databaseURL],
            ["VITE_FIREBASE_PROJECT_ID", config.projectId],
            ["VITE_FIREBASE_STORAGE_BUCKET", config.storageBucket],
            ["VITE_FIREBASE_MESSAGING_SENDER_ID", config.messagingSenderId],
            ["VITE_FIREBASE_APP_ID", config.appId],
            ["VITE_FIREBASE_MEASUREMENT_ID", config.measurementId || ""],
          ].map(([key, value]) => `${key}=${value || ""}`);
          fs.writeFileSync(".env.local", `${lines.join("\n")}\n`);
          NODE

      - name: Start local application
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/family-card-room-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/family-card-room-vite.log
          exit 1

      - name: Capture product screenshots
        run: node scripts/capture-readme-screenshots.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: artifacts/readme-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
