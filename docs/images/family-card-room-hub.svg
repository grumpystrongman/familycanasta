    <g transform="translate(715 285)"><rect width="595" height="205" rx="18" fill="#fffef9"/><circle cx="60" cy="58" r="34" fill="#fde7e9"/><text x="44" y="70" font-size="34" fill="#c73545">♥</text><rect x="444" y="22" width="124" height="34" rx="17" fill="#dff3ea"/><text x="464" y="45" fill="#19704f" font-size="15" font-weight="700">READY TO PLAY</text><text x="28" y="103" fill="#8f6b22" font-size="16" font-weight="700">AVOID THE POINTS</text><text x="28" y="143" fill="#18362d" font-family="Georgia,serif" font-size="38" font-weight="700">Hearts</text><text x="28" y="175" fill="#596f68" font-size="18">4 players · Passing · Shoot the moon</text><rect x="472" y="145" width="96" height="42" rx="8" fill="#19704f"/><text x="504" y="173" fill="white" font-size="18" font-weight="700">Play</text></g>
    <g transform="translate(90 520)"><rect width="595" height="205" rx="18" fill="#fffef9"/><circle cx="60" cy="58" r="34" fill="#e8e8f4"/><text x="44" y="69" font-size="34" fill="#252542">♠</text><rect x="444" y="22" width="124" height="34" rx="17" fill="#dff3ea"/><text x="464" y="45" fill="#19704f" font-size="15" font-weight="700">READY TO PLAY</text><text x="28" y="103" fill="#8f6b22" font-size="16" font-weight="700">BID WITH A PARTNER</text><text x="28" y="143" fill="#18362d" font-family="Georgia,serif" font-size="38" font-weight="700">Spades</text><text x="28" y="175" fill="#596f68" font-size="18">4 players · Nil bids · Bags · First to 500</text><rect x="472" y="145" width="96" height="42" rx="8" fill="#19704f"/><text x="504" y="173" fill="white" font-size="18" font-weight="700">Play</text></g>
