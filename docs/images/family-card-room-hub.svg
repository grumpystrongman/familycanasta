  <g transform="translate(1155 86) rotate(4)" filter="url(#shadow)"><rect width="96" height="136" rx="12" fill="white"/><text x="18" y="38" fill="#c62828" font-size="26" font-family="Arial">A♥</text></g>
  <g transform="translate(1230 76) rotate(-3)" filter="url(#shadow)"><rect width="96" height="136" rx="12" fill="white"/><text x="18" y="38" fill="#111" font-size="26" font-family="Arial">A♣</text></g>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
