<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Family Card Room game hub</title><desc id="desc">Central game selector showing Canasta, Hearts, Spades, and Rummy.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#063f32"/><stop offset="1" stop-color="#021f1a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".32"/></filter></defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1230" cy="90" r="180" fill="#18a06f" opacity=".08"/><circle cx="170" cy="760" r="220" fill="#f5c45d" opacity=".05"/>
  <text x="90" y="84" fill="#99e3ca" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">FAMILY GAME NIGHT</text>
  <text x="90" y="158" fill="white" font-family="Georgia,serif" font-size="64" font-weight="700">Pick a table. Deal the cards.</text>
  <text x="90" y="207" fill="#c7ded7" font-family="Arial,sans-serif" font-size="24">One home for the card games your family plays together.</text>
