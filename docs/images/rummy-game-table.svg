<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Rummy game table</title><desc id="desc">Rummy table with score panel, stock, discard pile, melds, and player hand.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f3029"/><stop offset="1" stop-color="#4e1715"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter></defs><rect width="1400" height="720" fill="url(#bg)"/><rect x="50" y="42" width="1300" height="636" rx="24" fill="#fffaf5" filter="url(#s)"/><text x="82" y="88" font-family="Arial" font-size="18" font-weight="700" fill="#b45d21">SETS AND RUNS</text><text x="82" y="136" font-family="Georgia,serif" font-size="48" font-weight="700" fill="#5b241d">Rummy</text><rect x="1170" y="76" width="140" height="44" rx="8" fill="#f4e8df"/><text x="1203" y="105" font-family="Arial" font-size="17" fill="#6b3b31">All games</text><g font-family="Arial"><g transform="translate(82 168)"><rect width="390" height="88" rx="14" fill="#f7ece4"/><text x="22" y="34" font-size="19" fill="#6b3b31">🦊 Family Host</text><text x="330" y="42" font-size="31" font-weight="700" fill="#a64b2a">64</text><text x="22" y="65" font-size="14" fill="#8c6b62">+18 this round · 7 cards</text></g><g transform="translate(492 168)"><rect width="390" height="88" rx="14" fill="#f7ece4"/><text x="22" y="34" font-size="19" fill="#6b3b31">🐙 Ruby</text><text x="330" y="42" font-size="31" font-weight="700" fill="#a64b2a">45</text><text x="22" y="65" font-size="14" fill="#8c6b62">+0 this round · 5 cards</text></g><g transform="translate(902 168)"><rect width="388" height="88" rx="14" fill="#f7ece4"/><text x="22" y="34" font-size="19" fill="#6b3b31">🦁 Milo</text><text x="330" y="42" font-size="31" font-weight="700" fill="#a64b2a">31</text><text x="22" y="65" font-size="14" fill="#8c6b62">+0 this round · 8 cards</text></g></g><rect x="